<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data:">
<link rel="stylesheet" href="menu-material.css">
<title>NOVA — Pause</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: transparent; color: #f7f8fa; font: 14px 'Segoe UI', sans-serif; }
  main { position: relative; isolation: isolate; margin: 2px; padding: 14px; border: 1px solid var(--menu-rim); border-radius: 15px; background: var(--menu-solid); }
  main:empty { display: none; }
  .pause-texture { position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: inherit; }
  .pause-texture:has(img[src])::after { content: ''; position: absolute; inset: 0; background: var(--menu-glass); }
  .pause-texture img { width: auto; height: auto; object-fit: fill; inset: auto; filter: var(--menu-blur); }
  .pause-texture img:not([src]) { display: none; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; font-size: 12px; color: #bcc6d7; }
  time { color: #aabaff; font-variant-numeric: tabular-nums; }
  section + section { margin-top: 10px; }
  h2 { margin: 0 0 6px; font-size: 14px; font-weight: 650; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  li { display: flex; align-items: center; gap: 10px; min-height: 43px; background: #ffffff0b; border-radius: 9px; padding: 4px 8px 4px 5px; }
  .art { position: relative; display: grid; place-items: center; flex: 0 0 33px; height: 33px; border-radius: 6px; overflow: hidden; background: #a4b5ff21; color: #c0cbff; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .copy { min-width: 0; display: grid; gap: 1px; }
  strong, .secondary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .secondary, p { color: #bdc7d6; font-size: 12px; }
  p { margin: 0; line-height: 1.4; }
  main.warning { display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 4px); min-height: 44px; padding: 6px 11px 6px 7px; border-radius: 11px; }
  .age { padding: 4px 8px; border: 1px solid var(--menu-rim); border-radius: 7px; font-size: 17px; font-weight: 700; }
  .warnings { display: grid; gap: 4px; }
  :root[data-theme='light'] body { color: #17191d; }
  :root[data-theme='light'] :is(header, .secondary, p, time) { color: #4f5465; }
  :root[data-theme='light'] li { background: #0000000a; }
  @media (prefers-reduced-motion: no-preference) { :root[data-motion='on'] main { animation: appear .16s ease-out both; } }
  @media (prefers-reduced-motion: no-preference) { :root[data-motion='on'] main.warning { animation: warning 5.5s ease both; } }
  @media (prefers-reduced-transparency: reduce), (forced-colors: active) { .pause-texture { display: none; } }
  @keyframes appear { from { opacity: 0; transform: translateY(-3px); } }
  @keyframes warning { 0%, 100% { opacity: 0; } 5%, 94% { opacity: 1; } }
</style>
<main aria-live="polite"></main>
<script src="pause-scene.js" defer></script>
</html>
